# ============================================================
# NEOINVENT ENTERPRISE — Render Blueprint
# Conecta tu repo a Render → New → Blueprint → este repo.
#
# IMPORTANTE: Render ELIMINÓ el plan free para Web Services (Node).
# Este blueprint despliega SOLO el frontend (Static Site, gratis siempre).
#
# El frontend funciona 100% standalone (localStorage) con todos los módulos.
# El backend está en /backend/ listo para desplegar en:
#   - Render Starter ($7/mes) — quita los comentarios del bloque backend abajo
#   - Alternativas gratis: Fly.io, Railway, Koyeb, Glitch
#
# La app detecta automáticamente si hay backend y cambia de modo.
# ============================================================

services:
  # ---------- FRONTEND (Static Site — PWA, gratis siempre) ----------
  - type: web
    name: neoinvent-frontend
    runtime: static
    rootDir: .
    buildCommand: echo "Frontend vanilla JS — sin build step"
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    plan: free

  # ============================================================
  # BACKEND: descomenta este bloque SOLO si tienes plan Starter ($7/mes)
  # o despliega /backend/ en una alternativa gratis (Fly.io, Koyeb).
  # La app detecta el backend automáticamente en Ajustes → URL del backend.
  # ============================================================
