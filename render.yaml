services:
  backend:
    type: web
    name: neoinvent-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: neoinvent-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MASTER_AUDIT_KEY_HASH
        sync: false
      - key: SENIAT_RIF
        sync: false
      - key: EMPRESA_NOMBRE
        sync: false
      - key: CORS_ORIGIN
        sync: false
    plan: free

  frontend:
    type: web
    name: neoinvent-frontend
    runtime: static
    buildCommand: echo "Static site, no build needed"
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    plan: free

databases:
  - name: neoinvent-db
    plan: free
    databaseName: neoinvent
    user: neoinvent