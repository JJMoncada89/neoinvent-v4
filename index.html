<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="NEOINVENT V4 — Sistema profesional de inventario, punto de venta, clientes, proveedores y reportes" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f172a'/><text x='50' y='68' font-size='52' font-family='Arial' font-weight='bold' fill='%2322d3ee' text-anchor='middle'>N</text></svg>" />
  <title>NEOINVENT V4 · Inventario & POS</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ===================== LOGIN ===================== -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo">N</div>
      <h1 class="login-title">NEOINVENT</h1>
      <p class="login-sub">Inventario · POS · Fiscal SENIAT</p>
      <form id="login-form">
        <div class="field">
          <label>Usuario</label>
          <input type="text" id="login-username" autocomplete="username" placeholder="ej. admin" required />
        </div>
        <div class="field">
          <label>Contraseña</label>
          <input type="password" id="login-password" autocomplete="current-password" placeholder="••••••••" required />
        </div>
        <p id="login-error" class="login-error" hidden></p>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn">Iniciar sesión</button>
      </form>
      <p class="login-hint">Demo: <strong>admin</strong> / <strong>admin123</strong></p>
    </div>
  </div>

  <!-- ===================== APP ===================== -->
  <div id="app" class="app" hidden>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">NEO<span>INV</span></div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="user-chip" id="user-chip"></div>
        <button class="btn btn-ghost btn-sm btn-block" id="btn-logout">Cerrar sesión</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="btn-menu" title="Menú">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div>
          <h1 id="page-title" class="topbar-title">Dashboard</h1>
          <p id="page-subtitle" class="topbar-subtitle"></p>
        </div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>

      <main class="content" id="content"></main>
    </div>
  </div>

  <!-- ===================== MODAL ===================== -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="icon-btn" id="modal-close" aria-label="Cerrar">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <!-- Scripts (modulares, Vanilla JS) -->
  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/inventory.js"></script>
  <script src="js/views/pos.js"></script>
  <script src="js/views/sales.js"></script>
  <script src="js/views/clients.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/hr.js"></script>
  <script src="js/views/payroll.js"></script>
  <script src="js/views/purchasing.js"></script>
  <script src="js/views/accounting.js"></script>
  <script src="js/views/services.js"></script>
  <script src="js/views/audit.js"></script>
</body>
</html>
